[project]
name = "witness"
version = "0.1.0"
description = "Differential-fuzzing acceptance oracle for Excel-to-Python ports"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "formulas>=1.2",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
alt = ["pycel>=1.0b30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]
